<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Quote by ' + quote.author}"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .quote-display {
            background-color: #e2e8f0;
            border-left: 5px solid #4299e1;
            padding: 1.5rem;
            border-radius: 10px;
        }

        .btn-primary {
            background-color: #4299e1;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(66, 153, 225, 0.3);
        }

        .btn-primary:hover {
            background-color: #3182ce;
            transform: scale(1.02);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.3s ease, transform 0.2s;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.25);
        }

        .btn-danger:hover {
            background-color: #dc2626;
            transform: scale(1.02);
        }

        input[type="text"], textarea {
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            width: 100%;
            box-sizing: border-box;
            background-color: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 4px rgba(66, 153, 225, 0.2);
        }

        label {
            font-weight: 600;
            color: #4a5568;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="container">
    <div sec:authorize="isAuthenticated()" class="flex justify-end mb-4">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-danger">Logout</button>
        </form>
    </div>

    <h1 class="text-4xl font-bold text-center text-gray-800 mb-10">Quote Details</h1>

    <!-- Quote Display -->
    <div class="quote-display mb-10">
        <p class="text-gray-800 text-2xl italic mb-4 leading-relaxed">
            "<span th:text="${quote.content}">Quote content goes here</span>"
        </p>
        <p class="text-gray-600 text-lg font-medium">
            - <span th:text="${quote.author}">Author Name</span>
        </p>
    </div>

    <!-- Edit Form -->
    <div class="bg-white p-6 rounded-xl shadow-lg mb-10">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4 border-b border-gray-200 pb-2">Edit Quote</h2>
        <form th:action="@{/user/quotes/{id}(id=${quote.id})}" method="post" id="editQuoteForm" class="space-y-6">
            <input type="hidden" name="_method" value="put" />
            <input type="hidden" name="id" th:value="${quote.id}" />

            <div>
                <label for="quoteContent" class="block mb-2">Quote Content:</label>
                <textarea id="quoteContent" name="content" rows="4"
                          class="shadow border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                          th:text="${quote.content}" required></textarea>
            </div>

            <div>
                <label for="author" class="block mb-2">Author:</label>
                <input type="text" id="author" name="author"
                       class="shadow border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                       th:value="${quote.author}" required />
            </div>

            <button type="submit" class="btn-primary w-full">Update Quote</button>
        </form>
    </div>

    <!-- Navigation Buttons -->
    <div class="bg-white p-6 rounded-xl shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4">
        <a th:href="@{/quotes}" class="btn-primary w-full sm:w-auto text-center">Back to All Quotes</a>

        <form th:action="@{/user/quotes/{id}(id=${quote.id})}" method="post" id="deleteQuoteForm" class="w-full sm:w-auto text-center">
            <input type="hidden" name="_method" value="delete" />
            <button type="submit" class="btn-danger w-full sm:w-auto" onclick="return confirm('Are you sure you want to delete this quote?');">
                Delete Quote
            </button>
        </form>
    </div>
</div>
</body>
</html>
