<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Tailwind CSS CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-xl */
            width: 100%;
            max-width: 28rem; /* max-w-md */
            text-align: center;
        }
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db; /* border-gray-300 */
            border-radius: 0.5rem; /* rounded-lg */
            margin-bottom: 1rem;
            font-size: 1rem;
            box-sizing: border-box; /* Ensures padding doesn't increase width */
        }
        .button-primary {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem; /* rounded-lg */
            font-weight: 600; /* font-semibold */
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .button-primary:hover {
            background-color: #4338ca; /* indigo-700 */
        }
        .button-google {
            background-color: #db4437; /* Google red */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.3s ease;
            text-decoration: none; /* Remove underline for links */
        }
        .button-google:hover {
            background-color: #c23321;
        }
        .google-icon {
            width: 1.25rem; /* 20px */
            height: 1.25rem; /* 20px */
        }
        .error-message {
            color: #ef4444; /* red-500 */
            background-color: #fee2e2; /* red-100 */
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #fca5a5; /* red-300 */
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Login to Your Account</h2>

    <!-- Display error message if present (e.g., from failed login) -->
    <div th:if="${param.error}" class="error-message">
        Invalid username or password.
    </div>
    <!-- Display logout message if present -->
    <div th:if="${param.logout}" class="error-message" style="background-color: #d1fae5; color: #065f46; border-color: #a7f3d0;">
        You have been logged out.
    </div>

    <!-- Basic Authentication Form -->
    <form th:action="@{/Log}" method="post" class="mb-6">
        <input type="text" id="username" name="username" placeholder="Username" class="input-field" required>
        <input type="password" id="password" name="password" placeholder="Password" class="input-field" required>
        <button type="submit" class="button-primary">Log In</button>
    </form>

    <div class="relative flex py-5 items-center">
        <div class="flex-grow border-t border-gray-300"></div>
        <span class="flex-shrink mx-4 text-gray-500">OR</span>
        <div class="flex-grow border-t border-gray-300"></div>
    </div>

    <!-- Google OAuth2 Login Button -->
    <a href="/oauth2/authorization/google" class="button-google mt-2">
        <svg class="google-icon" viewBox="0 0 533.5 544.3"><g><path d="M533.5 278.4c0-17.4-1.6-34.1-4.6-50.2H272v95.1h146.9c-6.3 34.1-25.1 62.9-53.6 82.2v68.2h86.7c50.7-46.7 81.5-115.5 81.5-195.3z" fill="#4285f4"/><path d="M272 544.3c72.6 0 133.7-24.1 178.2-65.5l-86.7-68.2c-24.1 16.1-54.8 25.7-91.5 25.7-70.4 0-130.1-47.6-151.5-111.2H31.1v69.9C75.7 497.1 167.6 544.3 272 544.3z" fill="#34a853"/><path d="M120.5 325.1c-10.6-31.7-10.6-65.6 0-97.3V157.9H31.1c-21.3 42.6-33.5 90.5-33.5 142.2s12.2 99.6 33.5 142.2l89.4-69.2z" fill="#fbbc04"/><path d="M272 107.7c39.6 0 75.1 13.6 103.1 40.2l77.4-77.4C405.7 24.1 344.6 0 272 0 167.6 0 75.7 47.2 31.1 157.9l89.4 69.9C141.9 155.3 201.6 107.7 272 107.7z" fill="#ea4335"/></g></svg>
        <span>Login with Google</span>
    </a>
    
    <div class="mt-4">
        <a th:href="@{/register}" class="text-indigo-600 hover:text-indigo-800 font-medium">
            Don't have an account? Sign up here
        </a>
    </div>

</div>
</body>
</html>
