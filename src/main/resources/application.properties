spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name?useSSL=false&serverTimezone=UTC
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret Key - IMPORTANT: Use a strong, securely stored key in production
jwt.secret=yourVeryStrongAndSecureJWTSecretKeyThatIsAtLeast256BitsLong
jwt.expiration=86400000 # 24 hours in milliseconds (adjust as needed)